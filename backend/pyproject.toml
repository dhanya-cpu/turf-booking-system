[project]
name = "turf-booking-backend"
version = "0.1.0"
description = "FastAPI backend for the turf booking system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# Depends()/Query() in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
